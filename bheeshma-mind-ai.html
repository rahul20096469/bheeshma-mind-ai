<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BHEESHMA MIND AI</title>
<style>
:root{--bg:#0d1017;--cd:#151a25;--ln:#232b3b;--tx:#e8ecf4;--mu:#8b95a8;--up:#2fc9a0;--dn:#f2557a;--ac:#eba33a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:12px 14px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font:800 17px/1 Georgia,"Times New Roman",serif;letter-spacing:.06em;color:var(--ac)}
.demo{font-size:11px;border:1px solid var(--dn);color:var(--dn);padding:2px 8px;border-radius:99px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:none;background:none;border:1px solid var(--ln);color:var(--mu);padding:6px 12px;border-radius:99px;font:inherit}
nav button.on{background:var(--ac);color:#1a1205;border-color:var(--ac);font-weight:700}
main{padding:14px;max-width:900px;margin:auto}
h2{font:700 20px Georgia,serif;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px;color:var(--mu);font-weight:600}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.k{font-size:12px;color:var(--mu)}.v{font-size:17px;font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}.ac{color:var(--ac)}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:9px;font:inherit;width:100%}
.r{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.r>*{flex:1 1 120px}
.b{background:var(--ac);color:#1a1205;border:0;border-radius:8px;padding:10px 14px;font:700 14px inherit;cursor:pointer}
.b.s{background:var(--ln);color:var(--tx);padding:5px 9px;font-weight:500}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:360px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500;font-size:12px}
.sig{display:inline-block;padding:4px 14px;border-radius:8px;font:800 20px Georgia,serif}
.BUY{background:var(--up);color:#06231b}.SELL{background:var(--dn);color:#2a0511}.WAIT{background:var(--ln);color:var(--ac)}
.note{font-size:12px;color:var(--mu)}footer{padding:10px 14px 24px;font-size:11px;color:var(--mu);text-align:center}
svg{width:100%;height:auto;display:block}
@media(prefers-reduced-motion:no-preference){main>section{animation:f .25s}@keyframes f{from{opacity:0}}}
</style></head><body>
<header><div class="logo">BHEESHMA MIND AI</div><span class="demo">DEMO DATA</span></header>
<nav id="nav"></nav><main id="m"></main>
<footer id="ft"></footer>
<script>
const $=s=>document.querySelector(s);
const ST={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const U=[["RELIANCE","Reliance Industries","India",1500,"₹"],["TCS","Tata Consultancy","India",3800,"₹"],["HDFCBANK","HDFC Bank","India",1650,"₹"],["INFY","Infosys","India",1500,"₹"],["TATAMOTORS","Tata Motors","India",950,"₹"],["NIFTY50","Nifty 50","India",22500,"₹"],["BANKNIFTY","Bank Nifty","India",48000,"₹"],["AAPL","Apple","USA",190,"$"],["NVDA","NVIDIA","USA",900,"$"],["MSFT","Microsoft","USA",410,"$"],["TSLA","Tesla","USA",180,"$"],["GOLD","Gold","Global",2350,"$"],["CRUDE","Crude Oil WTI","Global",78,"$"],["NIKKEI","Nikkei 225","Global",38000,"¥"]];
const find=s=>U.find(u=>u[0]===s.toUpperCase().trim());
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cache={};
function data(sym){if(typeof LIVE!=="undefined"&&LIVE.h&&LIVE.h[sym])return LIVE.h[sym];if(cache[sym]&&!(typeof LIVE!=="undefined"&&LIVE.q[sym]))return cache[sym];const u=find(sym);let h=0;for(const ch of sym)h=h*31+ch.charCodeAt(0);const r=rng(h),N=320,o=[];let p=u[3]*(.8+r()*.2),dr=0;
for(let i=0;i<N;i++){dr=dr*.97+(r()-.5)*.004;const op=p,c=p*(1+dr+(r()-.5)*.025),hi=Math.max(op,c)*(1+r()*.008),lo=Math.min(op,c)*(1-r()*.008);o.push({o:op,h:hi,l:lo,c,v:Math.round((1+r()*2)*1e6*(i>N-3?1+r()*2:1))});p=c}
if(typeof LIVE!=="undefined"&&LIVE.q[sym]){const L=LIVE.q[sym],last=o[o.length-1],prev=o[o.length-2];const sc=L.p/last.c;o.forEach(x=>{x.o*=sc;x.h*=sc;x.l*=sc;x.c*=sc});if(L.pc){prev.c=L.pc}last.c=L.p;last.h=Math.max(last.h,L.p);last.l=Math.min(last.l,L.p);if(L.v)last.v=L.v}
cache[sym]=o;return o}
const sma=(a,n)=>a.map((_,i)=>i<n-1?NaN:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
const ema=(a,n)=>{const k=2/(n+1),o=[];a.forEach((x,i)=>o.push(i?x*k+o[i-1]*(1-k):x));return o};
function rsi(c,n=14){const o=c.map(()=>NaN);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];if(i<=n){g+=Math.max(d,0)/n;l+=Math.max(-d,0)/n}else{g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}if(i>=n)o[i]=100-100/(1+g/(l||1e-9))}return o}
const f=(x,d=2)=>isFinite(x)?x.toLocaleString("en-IN",{maximumFractionDigits:d,minimumFractionDigits:d}):"-";
const pc=x=>`<span class="${x>=0?'up':'dn'}">${x>=0?'+':''}${f(x)}%</span>`;
function analyse(sym){const d=data(sym),c=d.map(x=>x.c),n=c.length-1,u=find(sym);
const s20=sma(c,20),s50=sma(c,50),e20=ema(c,20),r=rsi(c),m=ema(c,12).map((x,i)=>x-ema(c,26)[i]),sg=ema(m,9),
sd=Math.sqrt(c.slice(-20).reduce((a,x)=>a+(x-s20[n])**2,0)/20),bu=s20[n]+2*sd,bl=s20[n]-2*sd,
atr=d.slice(-14).reduce((a,x)=>a+x.h-x.l,0)/14,sup=Math.min(...d.slice(-30).map(x=>x.l)),res=Math.max(...d.slice(-30).map(x=>x.h));
let sc=0;const why=[];const t=(b,msg)=>{sc+=b;why.push((b>0?"▲ ":"▼ ")+msg)};
c[n]>s50[n]?t(1,"कीमत 50-SMA के ऊपर"):t(-1,"कीमत 50-SMA के नीचे");e20[n]>s50[n]?t(1,"EMA20 > SMA50"):t(-1,"EMA20 < SMA50");
(m[n]>sg[n])?t(1,"MACD सिग्नल के ऊपर"):t(-1,"MACD सिग्नल के नीचे");
if(r[n]<35)t(1,"RSI कम ("+f(r[n],0)+")");else if(r[n]>65)t(-1,"RSI ज़्यादा ("+f(r[n],0)+")");
if(c[n]<bl)t(1,"बोलिंजर निचले बैंड के नीचे");if(c[n]>bu)t(-1,"बोलिंजर ऊपरी बैंड के ऊपर");
const rec=sc>=2?"BUY":sc<=-2?"SELL":"WAIT",dir=rec==="SELL"?-1:1,risk=1.5*atr,en=c[n],sl=en-dir*risk;
return{u,d,c,n,s20,s50,e20,r:r[n],macd:m[n],sg:sg[n],bu,bl,atr,sup,res,rec,sc,why,en,sl,tg:[1.5,2.5,4].map(k=>en+dir*risk*k),conf:Math.min(85,50+Math.abs(sc)*8)}}
function chart(a){const d=a.d.slice(-70),W=700,H=300,hi=Math.max(...d.map(x=>x.h)),lo=Math.min(...d.map(x=>x.l)),y=v=>8+(hi-v)/(hi-lo)*(H-16),w=W/d.length;
let s=`<svg viewBox="0 0 ${W} ${H}">`;[a.sup,a.res].forEach((v,i)=>s+=`<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${i?'#f2557a':'#2fc9a0'}" stroke-dasharray="5 5" opacity=".6"/><text x="4" y="${y(v)-3}" fill="#8b95a8" font-size="11">${i?'रेज़िस्टेंस':'सपोर्ट'} ${f(v)}</text>`);
d.forEach((x,i)=>{const cx=i*w+w/2,col=x.c>=x.o?"#2fc9a0":"#f2557a";s+=`<line x1="${cx}" x2="${cx}" y1="${y(x.h)}" y2="${y(x.l)}" stroke="${col}"/><rect x="${cx-w*.32}" y="${y(Math.max(x.o,x.c))}" width="${w*.64}" height="${Math.max(1,Math.abs(y(x.o)-y(x.c)))}" fill="${col}"/>`});
const sm=a.s20.slice(-70);s+=`<polyline fill="none" stroke="#eba33a" stroke-width="1.6" points="${sm.map((v,i)=>isFinite(v)?`${i*w+w/2},${y(v)}`:"").join(" ")}"/></svg>`;return s}
/* backtest: walk-forward, one-bar delayed signals, costs */
function sim(c,sig,a,b){let eq=1,pk=1,dd=0,tr=0,w=0,pos=0,e0=1;for(let t=Math.max(a,2);t<b;t++){const p=sig[t-2]?1:0;if(p!==pos){eq*=1-.0015;if(p)e0=eq;else{tr++;if(eq>e0)w++}pos=p}if(pos)eq*=c[t]/c[t-1];pk=Math.max(pk,eq);dd=Math.max(dd,1-eq/pk)}return{r:(eq-1)*100,tr,w,dd:dd*100}}
function backtest(sym){const c=data(sym).map(x=>x.c),N=c.length,cut=Math.floor(N*.7),M={},S=n=>M[n]||(M[n]=sma(c,n)),R=rsi(c),all=[];
for(let fa=5;fa<=30;fa+=1)for(let sl=20;sl<=100;sl+=5)if(fa<sl){const A=S(fa),B=S(sl);all.push({k:"MA Crossover",p:fa+"/"+sl,sig:c.map((_,i)=>A[i]>B[i])})}
for(let lo=20;lo<=35;lo+=3)for(let hi=60;hi<=80;hi+=4){let st=false;all.push({k:"RSI",p:lo+"/"+hi,sig:c.map((_,i)=>{if(R[i]<lo)st=true;if(R[i]>hi)st=false;return st})})}
for(let n=10;n<=60;n+=5){let st=false;all.push({k:"Breakout",p:n,sig:c.map((_,i)=>{if(i<n)return false;const mx=Math.max(...c.slice(i-n,i)),mn=Math.min(...c.slice(i-n/2|0,i));if(c[i]>mx)st=true;if(c[i]<mn)st=false;return st})})}
all.forEach(x=>{x.tr=sim(c,x.sig,0,cut);x.te=sim(c,x.sig,cut,N)});
const best=[...all].sort((a,b)=>b.tr.r-a.tr.r)[0],worst=[...all].sort((a,b)=>a.te.r-b.te.r)[0];
return{all,best,worst,cut,N,bh:(c[N-1]/c[cut]-1)*100,trWin:all.filter(x=>x.tr.r>0).length,teWin:all.filter(x=>x.te.r>0).length,now:best.sig[N-1]}}
/* views */
const V={};let cur="home";
V.home=()=>`<h2>डैशबोर्ड</h2><div class="g">${["NIFTY50","BANKNIFTY","AAPL","GOLD","CRUDE","NIKKEI"].map(s=>{const d=data(s),u=find(s),ch=(d[d.length-1].c/d[d.length-2].c-1)*100;return`<div class="c"><div class="k">${u[1]}</div><div class="v">${u[4]}${f(d[d.length-1].c)}</div>${pc(LIVE.q[s]&&LIVE.q[s].ch!==null?LIVE.q[s].ch:ch)} <span class="note">${LIVE.q[s]?"LIVE":"DEMO"}</span></div>`}).join("")}</div><button class="b" onclick="refreshLive()">लाइव भाव अभी ताज़ा करें</button>
<div class="c"><b class="ac">प्रोटोटाइप स्थिति</b><p class="note">सभी कीमतें, चार्ट और सिग्नल सिमुलेटेड DEMO DATA हैं, असली बाज़ार नहीं। असली डेटा के लिए बाद में सुरक्षित बैकएंड से Live Price, Historical, News और Gemini API जोड़ी जाएगी। ये कोई निवेश सलाह नहीं है।</p></div>`;
V.analysis=()=>`<h2>AI स्टॉक एनालिसिस</h2><div class="r"><input id="q" list="sl" placeholder="सिंबल, जैसे RELIANCE" value="RELIANCE"><datalist id="sl">${U.map(u=>`<option value="${u[0]}">`).join("")}</datalist><button class="b" onclick="runA()">विश्लेषण करें</button></div><div id="out"></div>`;
window.runA=()=>{const s=$("#q").value,u=find(s);if(!u){$("#out").innerHTML=`<div class="c dn">"${s}" डेमो लिस्ट में नहीं है। ऊपर सुझाए गए सिंबल में से चुनें।</div>`;return}
const a=analyse(u[0]),cu=u[4],ch=(a.c[a.n]/a.c[a.n-1]-1)*100,hist=ST.g("hist",[]);hist.unshift({s:u[0],r:a.rec,p:a.en,t:new Date().toLocaleString("en-IN")});ST.s("hist",hist.slice(0,30));
$("#out").innerHTML=`<div class="c"><div class="k">${u[1]} · ${u[2]}</div><div class="v">${cu}${f(a.en)} ${pc(ch)}</div><div class="note">पिछला बंद ${cu}${f(a.c[a.n-1])} · वॉल्यूम ${f(a.d[a.n].v,0)}</div></div><div class="c">${chart(a)}<div class="note">पीली लाइन: SMA20 · डैश: सपोर्ट/रेज़िस्टेंस · ${LIVE.h[u[0]]?"कैंडल और भाव फायर्स से (असली)":"पूरा चार्ट DEMO है"}</div></div>
<div class="c"><div class="sig ${a.rec}">${a.rec}</div> <span class="note">कॉन्फिडेंस ${a.conf}% (डेमो)</span><div class="g" style="margin-top:10px"><div><div class="k">एंट्री</div><div class="v">${f(a.en)}</div></div><div><div class="k">स्टॉप लॉस</div><div class="v dn">${f(a.sl)}</div></div>${a.tg.map((t,i)=>`<div><div class="k">टारगेट ${i+1}</div><div class="v up">${f(t)}</div></div>`).join("")}<div><div class="k">रिस्क:रिवॉर्ड</div><div class="v">1 : 2.5</div></div></div>
<h3>कारण</h3>${a.why.map(w=>`<div>${w}</div>`).join("")}</div>
<div class="c"><div class="g"><div><div class="k">RSI(14)</div><div class="v">${f(a.r,1)}</div></div><div><div class="k">MACD</div><div class="v">${f(a.macd)}</div></div><div><div class="k">SMA20 / 50</div><div class="v">${f(a.s20[a.n],1)} / ${f(a.s50[a.n],1)}</div></div><div><div class="k">EMA20</div><div class="v">${f(a.e20[a.n],1)}</div></div><div><div class="k">बोलिंजर</div><div class="v">${f(a.bl,1)}–${f(a.bu,1)}</div></div><div><div class="k">सपोर्ट / रेज़िस्टेंस</div><div class="v">${f(a.sup,1)} / ${f(a.res,1)}</div></div></div></div>`}
let flt="All";
V.scanner=()=>{const L=U.filter(u=>flt==="All"||u[2]===flt).map(u=>{const d=data(u[0]),n=d.length-1,av=d.slice(-21,-1).reduce((s,x)=>s+x.v,0)/20;return{u,p:d[n].c,ch:(d[n].c/d[n-1].c-1)*100,v:d[n].v,vs:d[n].v/av}});
const T=(t,arr,k)=>`<h3>${t}</h3><div class="c w"><table><tr><th>नाम</th><th>सिंबल</th><th>कीमत</th><th>%</th><th>वॉल्यूम</th><th>मार्केट</th></tr>${arr.slice(0,10).map(x=>`<tr><td>${x.u[1]}</td><td>${x.u[0]}</td><td>${x.u[4]}${f(x.p)}</td><td>${pc(x.ch)}</td><td>${k?f(x.vs,1)+"x":f(x.v,0)}</td><td>${x.u[2]}</td></tr>`).join("")}</table></div>`;
return`<h2>मार्केट स्कैनर</h2><div class="r">${["All","India","USA","Global"].map(m=>`<button class="b ${m===flt?'':'s'}" onclick="flt='${m}';go('scanner')">${m}</button>`).join("")}</div>${T("टॉप गेनर्स",[...L].sort((a,b)=>b.ch-a.ch))}${T("टॉप लूज़र्स",[...L].sort((a,b)=>a.ch-b.ch))}${T("सबसे एक्टिव",[...L].sort((a,b)=>b.v-a.v))}${T("वॉल्यूम शॉकर्स (औसत से गुना)",[...L].sort((a,b)=>b.vs-a.vs),1)}`};
V.backtest=()=>`<h2>AI बैकटेस्टिंग</h2><div class="r"><input id="bq" list="sl" value="TCS"><datalist id="sl">${U.map(u=>`<option value="${u[0]}">`).join("")}</datalist><button class="b" onclick="runB()">टेस्ट चलाएँ</button></div><div id="bo"></div>`;
window.runB=()=>{const u=find($("#bq").value);if(!u){$("#bo").innerHTML=`<div class="c dn">सिंबल नहीं मिला।</div>`;return}const b=backtest(u[0]),B=b.best,W=b.worst;
$("#bo").innerHTML=`<div class="c"><div class="g"><div><div class="k">कुल टेस्ट (अलग पैरामीटर)</div><div class="v">${b.all.length}</div></div><div><div class="k">ट्रेन में मुनाफे वाले</div><div class="v">${b.trWin}</div></div><div><div class="k">आउट-ऑफ-सैंपल में मुनाफे वाले</div><div class="v">${b.teWin}</div></div></div>
<p class="note">डेटा: ${LIVE.h[u[0]]?"असली हिस्टोरिकल (फायर्स)":"कैंडल DEMO"}, ${b.N} दिन। पहले 70% पर सबसे अच्छा चुना, बाकी 30% पर परखा। सिग्नल एक बार देरी से लागू, खर्च 0.15% प्रति ट्रेड (ब्रोकरेज, टैक्स, स्लिपेज)।</p></div>
<div class="c"><h3>ट्रेन में सबसे अच्छी: ${B.k} (${B.p})</h3><div class="g"><div><div class="k">ट्रेन रिटर्न</div><div class="v">${pc(B.tr.r)}</div></div><div><div class="k">आउट-ऑफ-सैंपल रिटर्न</div><div class="v">${pc(B.te.r)}</div></div><div><div class="k">जीत दर (OOS)</div><div class="v">${B.te.tr?f(B.te.w/B.te.tr*100,0)+"%":"-"} (${B.te.tr} ट्रेड)</div></div><div><div class="k">अधिकतम ड्रॉडाउन (OOS)</div><div class="v dn">${f(B.te.dd,1)}%</div></div><div><div class="k">सिर्फ होल्ड (OOS)</div><div class="v">${pc(b.bh)}</div></div></div>
<h3>सबसे खराब (OOS): ${W.k} (${W.p})</h3>${pc(W.te.r)}

return`<h2>डैशबोर्ड</h2><div class="g">${idx.map(x=>`<div class="c"><div class="k">${x.u[1]} · <b>${x.live?"LIVE":"DEMO"}</b></div><div class="v">${x.u[4]}${f(x.p)}</div>${pc(x.ch)}${sp(x.d.slice(-40).map(k=>k.c),120,34,x.ch>=0?"#2fc9a0":"#f2557a")}</div>`).join("")}</div><div class="g"><div class="c"><h3>टॉप गेनर्स</h3>${g.slice(0,5).map(bar).join("")}</div><div class="c"><h3>टॉप लूज़र्स</h3>${g.slice(-5).reverse().map(bar).join("")}</div></div><button class="b" onclick="refreshLive()">लाइव भाव ताज़ा करें</button> <a class="b" style="display:inline-block;text-decoration:none" href="${WORKER}/login">फायर्स लॉगिन (रोज़ एक बार)</a><p class="note">LIVE तभी लिखा आता है जब Groww से भाव मिलें, वरना DEMO।</p>`};
const oldSc=V.scanner;
V.scanner=()=>{const A=ALL().filter(x=>flt==="All"||x.u[2]===flt),n=A.length||1,up=A.filter(x=>x.ch>=0).length,dn=A.length-up,s=[...A].sort((a,b)=>b.ch-a.ch),H=330;
const lane=(arr,y0,col)=>arr.map((x,i)=>{const y=y0+i*28+14;return`<path d="M184 ${H/2} C 300 ${H/2},300 ${y},400 ${y}" fill="none" stroke="${col}" stroke-width="1.6" opacity=".7"/><rect x="400" y="${y-12}" width="170" height="24" rx="5" fill="${col}" fill-opacity=".18" stroke="${col}"/><text x="408" y="${y+5}" fill="#e8ecf4" font-size="12">${x.u[0]}  ${x.ch>=0?'+':''}${f(x.ch)}%</text>`}).join("");
const fl=`<div class="c"><svg viewBox="0 0 580 ${H}" style="height:auto"><text x="10" y="40" fill="#2fc9a0" font-size="12">▲ BULLISH</text><text x="10" y="78" fill="#2fc9a0" font-size="34" font-weight="700">${up}</text><text x="10" y="${H-50}" fill="#f2557a" font-size="12">▼ BEARISH</text><text x="10" y="${H-14}" fill="#f2557a" font-size="34" font-weight="700">${dn}</text><rect x="170" y="10" width="14" height="${Math.max(2,(H-20)*up/n-3)}" fill="#2fc9a0"/><rect x="170" y="${10+(H-20)*up/n}" width="14" height="${Math.max(2,(H-20)*dn/n-3)}" fill="#f2557a"/>${lane(s.slice(0,5),0,"#2fc9a0")}${lane(s.slice(-5).reverse(),H-150,"#f2557a")}</svg><div class="note">${LIVE.ok?"भारतीय शेयर LIVE, बाकी DEMO":"सारा डेटा DEMO"}</div></div>`;
const o=oldSc(),i=o.indexOf("<h3>");return o.slice(0,i)+fl+o.slice(i)};
let IND=ST.g("ind",{rsi:1,macd:1,vol:1,sto:1});
const ln=(v,mn,mx,h,c)=>`<polyline fill="none" stroke="${c}" stroke-width="1.5" points="${v.map((x,i)=>`${i/(v.length-1)*700},${h-(x-mn)/(mx-mn||1)*h}`).join(" ")}"/>`;
const mini=(k,t,val,body)=>`<div class="c" id="m_${k}" style="${IND[k]?'':'display:none'}"><div class="k"><b>${t}</b> · ${val}</div><svg viewBox="0 0 700 90" style="height:90px">${body}</svg></div>`;
chart=function(a){const N=70,W=700,H=300,d=a.d.slice(-N),c=a.c,m20=sma(c,20),sd=c.map((_,i)=>i<19?NaN:Math.sqrt(c.slice(i-19,i+1).reduce((p,x)=>p+(x-m20[i])**2,0)/20)),
bu=m20.map((m,i)=>m+2*sd[i]).slice(-N),bl=m20.map((m,i)=>m-2*sd[i]).slice(-N),s20=m20.slice(-N),s50=sma(c,50).slice(-N),
hi=Math.max(...d.map(x=>x.h),...bu),lo=Math.min(...d.map(x=>x.l),...bl),y=v=>8+(hi-v)/(hi-lo)*(H-16),w=W/N;
const pl=(v,col,dash)=>`<polyline fill="none" stroke="${col}" stroke-width="1.4" ${dash?'stroke-dasharray="4 3"':''} points="${v.map((x,i)=>isFinite(x)?`${i*w+w/2},${y(x)}`:"").join(" ")}"/>`;
const main=`<svg viewBox="0 0 ${W} ${H}">`+d.map((x,i)=>{const cx=i*w+w/2,col=x.c>=x.o?"#2fc9a0":"#f2557a";return`<line x1="${cx}" x2="${cx}" y1="${y(x.h)}" y2="${y(x.l)}" stroke="${col}"/><rect x="${cx-w*.32}" y="${y(Math.max(x.o,x.c))}" width="${w*.64}" height="${Math.max(1,Math.abs(y(x.o)-y(x.c)))}" fill="${col}"/>`}).join("")+pl(s20,"#eba33a")+pl(s50,"#6aa5ff")+pl(bu,"#8b95a8",1)+pl(bl,"#8b95a8",1)+`</svg>`;
const R=rsi(c).slice(-N),e12=ema(c,12),e26=ema(c,26),M=e12.map((x,i)=>x-e26[i]),S=ema(M,9),Hh=M.map((x,i)=>x-S[i]),M7=M.slice(-N),S7=S.slice(-N),H7=Hh.slice(-N),mn=Math.min(...M7,...S7,...H7),mx=Math.max(...M7,...S7,...H7),z=90-(0-mn)/(mx-mn||1)*90;
const K=c.map((_,i)=>{if(i<13)return NaN;const sl=a.d.slice(i-13,i+1),l=Math.min(...sl.map(x=>x.l)),h=Math.max(...sl.map(x=>x.h));return(c[i]-l)/(h-l||1)*100}),D=sma(K,3),K7=K.slice(-N),D7=D.slice(-N),vv=d.map(x=>x.v),vm=Math.max(...vv);
const tg=[["rsi","RSI"],["macd","MACD"],["sto","स्टोकेस्टिक"],["vol","वॉल्यूम"]].map(([k,t])=>`<label class="note" style="margin-right:12px"><input type="checkbox" style="width:auto" ${IND[k]?"checked":""} onchange="IND['${k}']=this.checked;ST.s('ind',IND);document.getElementById('m_${k}').style.display=this.checked?'':'none'"> ${t}</label>`).join("");
return`<div class="note" style="margin-bottom:6px">पीली: SMA20 · नीली: SMA50 · धूसर डैश: बोलिंजर बैंड</div>`+main+`<div style="margin:8px 0">${tg}</div>`
+mini("rsi","RSI (14)",f(R[N-1],1)+(R[N-1]>70?" · ज़्यादा खरीदा":R[N-1]<30?" · ज़्यादा बिका":""),`<line x1="0" x2="700" y1="27" y2="27" stroke="#f2557a" stroke-dasharray="3 3"/><line x1="0" x2="700" y1="63" y2="63" stroke="#2fc9a0" stroke-dasharray="3 3"/>`+ln(R,0,100,90,"#eba33a"))
+mini("macd","MACD",f(M7[N-1])+" / सिग्नल "+f(S7[N-1]),H7.map((x,i)=>`<rect x="${i*10+1}" y="${Math.min(z,90-(x-mn)/(mx-mn||1)*90)}" width="8" height="${Math.abs(90-(x-mn)/(mx-mn||1)*90-z)}" fill="${x>=0?'#2fc9a0':'#f2557a'}" opacity=".6"/>`).join("")+ln(M7,mn,mx,90,"#6aa5ff")+ln(S7,mn,mx,90,"#eba33a"))
+mini("sto","स्टोकेस्टिक (14,3)","%K "+f(K7[N-1],0)+" · %D "+f(D7[N-1],0),`<line x1="0" x2="700" y1="18" y2="18" stroke="#f2557a" stroke-dasharray="3 3"/><line x1="0" x2="700" y1="72" y2="72" stroke="#2fc9a0" stroke-dasharray="3 3"/>`+ln(K7,0,100,90,"#2fc9a0")+ln(D7,0,100,90,"#f2557a"))
+mini("vol","वॉल्यूम",f(vv[N-1],0),vv.map((x,i)=>`<rect x="${i*10+1}" y="${90-x/vm*88}" width="8" height="${x/vm*88}" fill="${d[i].c>=d[i].o?'#2fc9a0':'#f2557a'}" opacity=".7"/>`).join(""))};
const bub=m=>`<div style="align-self:${m.r==="u"?"flex-end":"flex-start"};max-width:86%;background:${m.r==="u"?"var(--ac)":"var(--bg)"};color:${m.r==="u"?"#1a1205":"var(--tx)"};border:1px solid var(--ln);border-radius:12px;padding:8px 11px;white-space:pre-wrap">${esc(m.t)}</div>`;
V.assist=()=>{const H=ST.g("chat",[]);return`<h2>AI असिस्टेंट</h2><div class="c" style="padding:8px"><div id="cb" style="height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px">${H.map(bub).join("")||'<span class="note">कुछ पूछिए, जैसे: TCS का विश्लेषण करो</span>'}</div><div class="r" style="margin:8px 0;flex-wrap:nowrap"><textarea id="ci" rows="1" placeholder="सवाल लिखें..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="b" style="flex:0 0 auto" onclick="send()">भेजें</button></div><button class="b s" onclick="ST.s('chat',[]);go('assist')">चैट मिटाएँ</button></div><p class="note">बाज़ार डेटा: ${LIVE.ok?"भारत LIVE, बाकी DEMO":"DEMO"} · निवेश सलाह नहीं</p>`};
window.send=async()=>{const i=$("#ci"),q=i.value.trim();if(!q)return;const H=ST.g("chat",[]);H.push({r:"u",t:q});ST.s("chat",H);i.value="";const cb=$("#cb");cb.insertAdjacentHTML("beforeend",bub({r:"u",t:q})+'<div id="ty" class="note">सोच रहा है...</div>');cb.scrollTop=cb.scrollHeight;
const facts=U.filter(u=>q.toUpperCase().includes(u[0])).map(u=>{const a=analyse(u[0]);return u[0]+": "+a.rec+", एंट्री "+f(a.en)+", SL "+f(a.sl)+", सपोर्ट "+f(a.sup)+", रेज़िस्टेंस "+f(a.res)+", RSI "+f(a.r,0)}).join("\n"),hist=H.slice(-9,-1).map(m=>(m.r==="u"?"यूज़र: ":"असिस्टेंट: ")+m.t).join("\n"),
prompt="आप ट्रेडिंग असिस्टेंट हैं। डेटा स्थिति: "+(LIVE.ok?"भारतीय भाव LIVE, बाकी और सारे चार्ट DEMO":"सारा DEMO")+"। DEMO को असली न बताएँ, सलाह या गारंटी न दें, हिंदी में छोटा जवाब दें।\nतथ्य:\n"+(facts||"कोई नहीं")+"\nपिछली बातचीत:\n"+hist+"\nयूज़र: "+q;
let t;try{const r=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});const j=await r.json();t=j.text||JSON.stringify(j)}catch(e){t="Gemini से जुड़ नहीं पाया। साइट को अपने GitHub Pages लिंक से खोलिए।"}
H.push({r:"a",t});ST.s("chat",H.slice(-60));const ty=$("#ty");if(ty)ty.remove();cb.insertAdjacentHTML("beforeend",bub({r:"a",t}));cb.scrollTop=cb.scrollHeight};
const NAV=[["home","होम"],["analysis","एनालिसिस"],["scanner","स्कैनर"],["backtest","बैकटेस्ट"],["risk","रिस्क"],["journal","जर्नल"],["portfolio","पोर्टफोलियो"],["paper","पेपर ट्रेड"],["alerts","अलर्ट"],["news","न्यूज़"],["assist","असिस्टेंट"],["history","हिस्ट्री"],["more","और"]];
window.go=p=>{cur=p;$("#nav").innerHTML=NAV.map(n=>`<button class="${n[0]===p?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join("");$("#m").innerHTML=`<section>${V[p]()}</section>`;window.scrollTo(0,0)};
$("#ft").textContent="डेटा स्रोत: सिमुलेटेड DEMO · स्थिति: लाइव नहीं · अपडेट: "+new Date().toLocaleString("en-IN")+" · कोई निवेश सलाह नहीं";
go("home");
loadLive();
</script></body></html>
